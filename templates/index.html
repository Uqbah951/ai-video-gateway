<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Gateway | Enterprise Dashboard</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: #111827;
            --border-color: #1f2937;
            --accent-blue: #38bdf8;
            --accent-green: #059669;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            color: var(--accent-blue);
            font-size: 26px;
            margin: 0 0 5px 0;
        }

        .header-title p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .badge {
            background: var(--accent-green);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-card strong {
            color: var(--text-main);
            font-size: 16px;
            font-family: monospace;
        }

        .action-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        .action-card h3 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: #1a2234;
            border: 1px solid #374151;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 20px;
            background: #060911;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .footer-nav {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-nav a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header-card">
            <div class="header-title">
                <h1>AI Video Gateway</h1>
                <p>Asynchronous GPU Rendering Pipeline & API Service</p>
            </div>
            <div class="badge">Operational</div>
        </div>

        <!-- System Stats Grid -->
        <div class="grid-stats">
            <div class="stat-card">
                <span>Active Test API Key</span>
                <strong>sk_live_test123</strong>
            </div>
            <div class="stat-card">
                <span>Model Pipeline</span>
                <strong>3-Min Cinematic Engine</strong>
            </div>
        </div>

        <!-- Video Generation Control Panel -->
        <div class="action-card">
            <h3>Generate AI Video Project</h3>
            <form id="videoForm">
                <label for="apiKey">Authorization API Key</label>
                <input type="text" id="apiKey" value="sk_live_test123" required>
                
                <label for="prompt">Scene Prompt / Concept Description</label>
                <textarea id="prompt" rows="3" placeholder="Describe your 3-minute video concept (e.g., Ultra-realistic cinematic drone shot over a neon-lit futuristic metropolis)..." required></textarea>
                
                <button type="submit" id="submitBtn">Dispatch Rendering Job (15 Credits)</button>
            </form>

            <div id="resultBox" class="result-box">
                <p style="margin-top:0;"><strong>Pipeline Status:</strong> <span id="jobStatus" style="color: #fbbf24;">Initializing...</span></p>
                <p style="font-size: 13px; color: var(--text-muted); word-break: break-all;"><strong>Job ID:</strong> <span id="jobIdText"></span></p>
                <div id="videoContainer" style="margin-top: 15px; display: none;">
                    <p style="font-size: 13px; color: #34d399; font-weight: bold;">Render Complete:</p>
                    <video id="videoOutput" controls style="width: 100%; border-radius: 8px; border: 1px solid var(--border-color);"></video>
                </div>
            </div>
        </div>
        
        <!-- Footer Navigation -->
        <div class="footer-nav">
            <a href="/admin/keys?secret=markaz_secure_2026" target="_blank">Access Live Admin Database Panel ↗</a>
        </div>
    </div>

    <script>
        document.getElementById('videoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const jobStatus = document.getElementById('jobStatus');
            const jobIdText = document.getElementById('jobIdText');
            const videoContainer = document.getElementById('videoContainer');
            const videoOutput = document.getElementById('videoOutput');

            btn.disabled = true;
            btn.textContent = "Queuing Task...";
            resultBox.style.display = "block";
            videoContainer.style.display = "none";
            jobStatus.textContent = "Sending request to gateway...";
            jobStatus.style.color = "#fbbf24";
            jobIdText.textContent = "Processing...";

            try {
                const response = await fetch('/v1/generate-video', {
                    method: 'POST',
                    headers: {
                        'Authorization': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt, duration: "3min" })
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || "Failed to start generation");
                    btn.disabled = false;
                    btn.textContent = "Dispatch Rendering Job (15 Credits)";
                    resultBox.style.display = "none";
                    return;
                }

                const jobId = data.job_id;
                jobIdText.textContent = jobId;
                btn.textContent = "Rendering in Progress...";

                const interval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/v1/status/${jobId}`);
                        const statusData = await statusRes.json();

                        if (statusData.status === "completed") {
                            clearInterval(interval);
                            jobStatus.textContent = "Completed Successfully";
                            jobStatus.style.color = "#34d399";
                            btn.disabled = false;
                            btn.textContent = "Dispatch Rendering Job (15 Credits)";
                            
                            if (statusData.video_url) {
                                videoOutput.src = statusData.video_url;
                                videoContainer.style.display = "block";
                            }
                        } else {
                            jobStatus.textContent = "GPU Worker processing frames...";
                        }
                    } catch (err) {
                        console.error("Polling error:", err);
                    }
                }, 3000);

            } catch (err) {
                alert("Network error: " + err.message);
                btn.disabled = false;
                btn.textContent = "Dispatch Rendering Job (15 Credits)";
                resultBox.style.display = "none";
            }
        });
    </script>
</body>
</html>
